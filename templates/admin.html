<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LeadDesk Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Lead Management</h2>
        <a href="/" class="btn btn-outline-secondary">View Public Site</a>
    </div>

    <!-- Search Input -->
    <input type="text" id="searchInput" class="form-control mb-4" placeholder="Search by name, email, or status..." onkeyup="filterTable()">

    <div class="card shadow-sm">
        <table class="table table-hover mb-0" id="leadsTable">
            <thead class="table-light">
                <tr>
                    <th>Date Added</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Budget</th>
                    <th>Message</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for lead in leads %}
                <tr>
                    <!-- NEW DATA CELL formatting the timestamp nicely -->
                    <td class="text-muted small">{{ lead.created_at.strftime('%b %d, %Y') }}</td>
                    <td>{{ lead.name }}</td>
                    <td>{{ lead.email }}</td>
                    <td>{{ lead.budget }}</td>
                    <td>{{ lead.message }}</td>
                    <td>
                        <!-- Status Toggle Form -->
                        <form action="/update_status/{{ lead.id }}" method="POST">
                            <select name="status" class="form-select form-select-sm" onchange="this.form.submit()">
                                <option value="New" {% if lead.status == 'New' %}selected{% endif %}>New</option>
                                <option value="Contacted" {% if lead.status == 'Contacted' %}selected{% endif %}>Contacted</option>
                                <option value="Closed" {% if lead.status == 'Closed' %}selected{% endif %}>Closed</option>
                            </select>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="6" class="text-center py-4">No leads found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<!-- Simple JS for Search Filtering -->
<script>
function filterTable() {
    let input = document.getElementById("searchInput").value.toLowerCase();
    let rows = document.querySelectorAll("#leadsTable tbody tr");

    rows.forEach(row => {
        let text = row.innerText.toLowerCase();
        row.style.display = text.includes(input) ? "" : "none";
    });
}
</script>

</body>
</html>
