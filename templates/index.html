<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LeadDesk Mini</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div class="container mt-5 flex-grow-1" style="max-width: 600px;">
    <h2 class="mb-4">Contact Us</h2>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Budget Range</label>
            <select name="budget" class="form-select" required>
                <option value="">Select a range...</option>
                <option value="Under $1,000">Under $1,000</option>
                <option value="$1,000 - $5,000">$1,000 - $5,000</option>
                <option value="$5,000+">$5,000+</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea name="message" rows="4" class="form-control" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100">Submit Lead</button>
    </form>
</div>

<!-- MANDATORY FOOTER -->
<footer class="mt-auto py-3 bg-white text-center border-top">
    <div class="container">
        <span class="text-muted">Built for <a href="https://digitalheroesco.com" target="_blank">Digital Heroes Training Task</a></span>
    </div>
</footer>

</body>
</html>
